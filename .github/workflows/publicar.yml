name: Publicar no Apps Script

# Envia o conteúdo de src/ para o projeto Apps Script da planilha
# sempre que algo em src/ mudar na branch main (ou manualmente).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar sintaxe dos fontes
        run: node scripts/verificar-sintaxe.js src

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Configurar credenciais do clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON não configurado"; exit 1; fi
          if [ -z "$SCRIPT_ID" ];   then echo "::error::Secret SCRIPT_ID não configurado"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8'))" \
            || { echo "::error::CLASPRC_JSON não é um JSON válido (cole o conteúdo inteiro do ~/.clasprc.json)"; exit 1; }
          printf '{"scriptId":"%s","rootDir":"src","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json

      - name: Enviar código (clasp push)
        run: clasp push --force

      - name: Atualizar implantação
        if: ${{ env.DEPLOYMENT_ID != '' }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} - ${GITHUB_ACTOR}"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Publicação no Apps Script"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Arquivos em src/:"
            ls src | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
